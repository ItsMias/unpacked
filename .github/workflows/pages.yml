# Builds the site (web/, using the prebuilt engine in web/src/lib/pkg) and publishes it to GitHub
# Pages at unpacked.itsmias.xyz.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tells Bing (and the other IndexNow search engines) the page changed. The key file is
      # web/public/<key>.txt; it must be live before the ping, so wait for it. A failed ping doesn't fail the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          HOST: unpacked.itsmias.xyz
          KEY: e90ec67da6b11a06265657c595ec377a
        run: |
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors -o /dev/null "https://$HOST/$KEY.txt"
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[\"https://$HOST/\"]}" \
            -w 'IndexNow: HTTP %{http_code}\n'
