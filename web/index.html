<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unpacked: Discord Stats From Your Data Package</title>
<meta name="description" content="All-time stats from your Discord data package: messages, calls, people, servers and games. Read in your browser; nothing is uploaded.">
<meta name="theme-color" content="#1e1f22">

<!-- Search engines. The WebSite name is what Google shows as the site name above the result.
     robots.txt and sitemap.xml are in public/; the long hex .txt there is the IndexNow key
     (see .github/workflows/pages.yml). -->
<link rel="canonical" href="https://unpacked.itsmias.xyz/">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "name": "Unpacked",
      "url": "https://unpacked.itsmias.xyz/"
    },
    {
      "@type": "WebApplication",
      "name": "Unpacked",
      "url": "https://unpacked.itsmias.xyz/",
      "description": "Turns your Discord data package into all-time stats: messages, calls, people, servers, games, emoji, devices and purchases. Unofficial and open source; the package is read in your browser and never uploaded.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript and WebAssembly",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "image": "https://unpacked.itsmias.xyz/og.png",
      "author": { "@type": "Person", "name": "Mias", "alternateName": "ItsMias", "url": "https://itsmias.xyz/" },
      "sameAs": ["https://github.com/ItsMias/unpacked"]
    }
  ]
}
</script>

<!-- Link previews. Discord shows the component embed below; everything else (and Discord as a
     fallback) uses the Open Graph tags. Tags must be in the HTML: crawlers don't run scripts.
     Discord caches images by URL: when public/og.png changes, change its ?v= (both places below). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Unpacked">
<meta property="og:title" content="Unpacked">
<meta property="og:description" content="See all-time stats on your messages, calls, people, servers, games and more. Works with “Use data to improve Discord” turned off.">
<meta property="og:url" content="https://unpacked.itsmias.xyz/">
<meta property="og:image" content="https://unpacked.itsmias.xyz/og.png?v=c9e79131">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Unpacked: a profile card, a chart of when you talk and a calendar of messages per day">
<meta name="twitter:card" content="summary_large_image">
<!-- Browsers use the first theme-color and Discord the last: the page stays dark, previews get the accent. -->
<meta name="theme-color" content="#bd4be0">
<script id="discord:component-embed" type="application/vnd.discord.component-embed+json">
{
  "component": {
    "type": 17,
    "accent_color": 12405728,
    "components": [
      {
        "type": 12,
        "items": [
          {
            "media": {
              "url": "https://unpacked.itsmias.xyz/og.png?v=c9e79131"
            },
            "description": "Unpacked: a profile card, a chart of when you talk and a calendar of messages per day"
          }
        ]
      },
      {
        "type": 10,
        "content": "# Unpacked\nSee all-time stats on your messages, calls, people, servers, games and more."
      },
      {
        "type": 10,
        "content": "-# Works with “Use data to improve Discord” turned off."
      },
      {
        "type": 1,
        "components": [
          {
            "type": 2,
            "style": 5,
            "label": "Open Unpacked",
            "url": "https://unpacked.itsmias.xyz/"
          },
          {
            "type": 2,
            "style": 5,
            "label": "Try the demo",
            "url": "https://unpacked.itsmias.xyz/?demo"
          },
          {
            "type": 2,
            "style": 5,
            "label": "Source code",
            "url": "https://github.com/ItsMias/unpacked"
          }
        ]
      }
    ]
  }
}
</script>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/Figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
