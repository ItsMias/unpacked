[package]
name = "engine"
description = "Unpacked: Discord data package analysis"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "unpacked-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[dependencies]
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }

[features]
cli = ["dep:zip"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
